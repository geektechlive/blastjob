[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blastjob"
version = "0.1.0"
description = "AI-powered resume tailoring and job-search cockpit"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "weasyprint>=62.0",
    "markdown>=3.6",
    "platformdirs>=4.2",
    "tomli-w>=1.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = [
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
blastjob-web = "blastjob.web.launch:main"
blastjob-daily = "blastjob.daily:main"
blastjob = "blastjob.setup_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blastjob"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]

# Third-party libraries that ship no type information (openai is optional).
[[tool.mypy.overrides]]
module = ["fitz", "markdown", "weasyprint", "weasyprint.*", "openai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
