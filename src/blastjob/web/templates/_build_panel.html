{# Streams one run's events. Wired by static/cockpit.js from the data attributes:
   no script lives here, because a script in a swapped-in partial is checked against
   the page's CSP nonce, not this response's. #}
<div class="build-panel" data-run-id="{{ run.id }}"
     {% if job_id %}data-done-get="/jobs/{{ job_id }}/packet" data-done-target="#packet-{{ job_id }}"{% endif %}>
  <div class="build-status" id="bs-{{ run.id }}">{{ heading }}&hellip;</div>
  <pre class="build-out" id="bo-{{ run.id }}"></pre>
</div>
