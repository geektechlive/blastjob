{# The _build_panel with a follow-up link loaded into #fl-<run id> when the run is
   done, so other run types keep their existing behaviour. #}
<div class="build-panel" data-run-id="{{ run.id }}"
     data-done-get="/builds/{{ run.id }}/followup-link" data-done-target="#fl-{{ run.id }}">
  <div class="build-status" id="bs-{{ run.id }}">{{ heading }}&hellip;</div>
  <pre class="build-out" id="bo-{{ run.id }}"></pre>
  <div id="fl-{{ run.id }}"></div>
</div>
